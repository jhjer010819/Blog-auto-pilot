# Publishes the Next.js static export with GitHub Actions Pages.
# Does not use a gh-pages branch and does not run the keyword pipeline.
# One-time repo setting: Settings → Pages → Source: GitHub Actions.
# The published artifact is out/ and includes CNAME (blog.mymallow.cloud).
# Canonical URLs live in src/lib/site.ts. This workflow does not change the Pages custom domain.
# content/** is on the path filter, so a post commit on main starts this rebuild.
# publish_post.yml pushes with GITHUB_TOKEN (which does not fire this push trigger) and then
# runs `gh workflow run deploy-pages.yml --ref main`. Keep workflow_dispatch.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "content/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export static site
        run: npm run export

      - name: Prepare Pages output
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/blog/index.html
          test -f out/tools/index.html
          test -f out/about/index.html
          test -f out/privacy/index.html
          test -f out/terms/index.html
          test -f out/contact/index.html
          post_count=0
          for file in content/posts/*.html; do
            slug=$(basename "$file" .html)
            test -f "out/blog/${slug}/index.html"
            test -f "out/posts/${slug}/index.html"
            grep -q "https://mymallow.cloud/blog/${slug}/" "out/posts/${slug}/index.html"
            grep -q 'http-equiv="refresh"' "out/posts/${slug}/index.html"
            post_count=$((post_count + 1))
          done
          test "$post_count" -gt 0
          grep -q '소개' out/index.html
          grep -q '개인정보처리방침' out/index.html
          grep -q '이용약관' out/index.html
          grep -q '문의' out/index.html
          grep -q '최신 글' out/index.html
          grep -q 'google-adsense-account' out/index.html
          grep -q 'ca-pub-5854572232694460' out/index.html
          grep -q 'G-318MMGWL1K' out/index.html
          test -f out/sitemap.xml
          grep -q 'https://mymallow.cloud/blog/' out/sitemap.xml
          grep -q 'https://mymallow.cloud/tools/' out/sitemap.xml
          test -f out/robots.txt
          grep -q 'https://mymallow.cloud/sitemap.xml' out/robots.txt
          test -f out/ads.txt
          grep -qx 'google.com, pub-5854572232694460, DIRECT, f08c47fec0942fa0' out/ads.txt
          test -f out/og-default.png
          test -f out/logo.png
          printf '%s\n' 'blog.mymallow.cloud' > out/CNAME
          grep -qx 'blog.mymallow.cloud' out/CNAME
          touch out/.nojekyll
          test ! -f out/main.py
          test ! -f out/requirements.txt
          grep -R -q 'https://fieldtrip.mymallow.cloud/' out/blog
          if grep -R -n --binary-files=without-match 'blog\.mallow\.cloud' out; then
            echo "found blog.mallow.cloud in the export"
            exit 1
          fi
          if grep -R -n --binary-files=without-match 'https://mallow\.cloud' out; then
            echo "found https://mallow.cloud in the export"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
