# Publishes the Next.js static export with GitHub Actions Pages.
# Does not use a gh-pages branch and does not run the keyword pipeline.
# One-time repo setting: Settings → Pages → Source: GitHub Actions.
# The published artifact is out/ and includes CNAME (blog.mymallow.cloud).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "content/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export static site
        run: npm run export

      - name: Prepare Pages output
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/posts/2026-youth-rent-support/index.html
          test -f out/posts/starbucks-winter-frequency/index.html
          test -f out/posts/2026-year-end-tax-refund/index.html
          test -f out/posts/sagwanhakgyo-sinchegeomsa-bulhapgyeok-gijungwa-ipsi-jiwonja-jaegeom-daecheobeop/index.html
          test -f out/sitemap.xml
          grep -q 'sagwanhakgyo-sinchegeomsa-bulhapgyeok-gijungwa-ipsi-jiwonja-jaegeom-daecheobeop' out/sitemap.xml
          test -f out/robots.txt
          test -f out/ads.txt
          grep -qx 'google.com, pub-5854572232694460, DIRECT, f08c47fec0942fa0' out/ads.txt
          test -f out/og-default.png
          test -f out/logo.png
          printf '%s\n' 'blog.mymallow.cloud' > out/CNAME
          grep -qx 'blog.mymallow.cloud' out/CNAME
          touch out/.nojekyll
          test ! -f out/main.py
          test ! -f out/requirements.txt
          grep -q 'https://fieldtrip.mymallow.cloud/' out/posts/2026-youth-rent-support/index.html
          if grep -R -n --binary-files=without-match 'blog\.mallow\.cloud' out; then
            echo "found blog.mallow.cloud in the export"
            exit 1
          fi
          if grep -R -n --binary-files=without-match 'https://mallow\.cloud' out; then
            echo "found https://mallow.cloud in the export"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
