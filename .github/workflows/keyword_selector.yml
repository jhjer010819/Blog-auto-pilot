name: 3호 블로그 1단계 키워드 자동 수집 & 선별 테스트

on:
  schedule:
    - cron: '0 21 * * *' # 매일 아침 06시 (한국시간) 자동 실행
  workflow_dispatch: # 깃허브 웹 화면에서 버튼 눌러 언제든 수동 테스트 실행 가능

jobs:
  run-keyword-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 깃허브 저장소 코드 가져오기
        uses: actions/checkout@v3

      - name: 파이썬 3.12 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 키워드 수집 & 제미니 선별 파이프라인 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
